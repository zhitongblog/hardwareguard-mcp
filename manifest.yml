modules:
  rovo:mcp:
    - key: hardwareguard-mcp-server
      name: "HardwareGuard IPD MCP"
      tools:
        - audit-bom-table
        - check-ipd-gate
        - trace-hardware-eco
        - generate-review-minutes

  action:
    - key: audit-bom-table
      name: "Audit PCBA BOM vs Schematic"
      function: auditBomResolver
      actionVerb: GET
      description: "Compare a PCBA BOM CSV against schematic reference parts to detect swapped values, footprint mismatches (SMB vs SMA), duplicate designators, missing MPNs, and capacitor derating violations."
      inputs:
        bomCsv:
          title: "BOM CSV"
          type: string
          description: "Raw BOM CSV text (Designator,Value,Footprint,MPN,VoltageRating,BusVoltage,Status)"
        schematicJson:
          title: "Schematic JSON"
          type: string
          description: "Optional JSON array of schematic components [{designator,value,footprint}]"
    - key: check-ipd-gate
      name: "Evaluate IPD Release Gate"
      function: checkIpdGateResolver
      actionVerb: GET
      description: "Evaluate open hardware issues and risk-accepted exceptions to compute a conservative PASS, CONDITIONAL, or REJECT tape-out verdict with owner routing."
      inputs:
        boardName:
          title: "Board Name"
          type: string
          description: "Hardware board or product name (e.g. PB95-Mainboard-RevC)"
        issuesJson:
          title: "Issues JSON"
          type: string
          description: "JSON array of defect issues [{id,layer,severity,summary,riskAccepted}]"
    - key: trace-hardware-eco
      name: "Trace Cross-Board ECO Risk"
      function: traceEcoResolver
      actionVerb: GET
      description: "Validate connector pinout and power-domain compatibility between two mated PCBs (L4 cross-board voltage conflict and open signal check)."
      inputs:
        connectorsJson:
          title: "Connectors JSON"
          type: string
          description: "JSON array of mated pin pairs [{connector,pin,boardA_net,boardA_voltage,boardB_net,boardB_voltage}]"
    - key: generate-review-minutes
      name: "Generate Hardware Review Minutes"
      function: generateMinutesResolver
      actionVerb: GET
      description: "Produce executive-ready Markdown hardware review minutes with release verdict, blockers by owner, and visible risk-accepted ledger."
      inputs:
        boardName:
          title: "Board Name"
          type: string
          description: "Board or product name"
        auditJson:
          title: "Audit JSON"
          type: string
          description: "JSON output from audit-bom-table or check-ipd-gate"

  function:
    - key: auditBomResolver
      handler: index.auditBomResolver
    - key: checkIpdGateResolver
      handler: index.checkIpdGateResolver
    - key: traceEcoResolver
      handler: index.traceEcoResolver
    - key: generateMinutesResolver
      handler: index.generateMinutesResolver

permissions:
  scopes:
    - read:jira-work
    - read:confluence-content.summary
    - read:confluence-content.all

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/ca9901af-d16e-4831-bb64-b7e43575f20b
