modules:
  rovo:mcp:
    - key: hardwareguard-mcp-server
      name: "HardwareGuard BOM & IPD Release-Gate MCP"
      description: "Deterministic PCBA BOM auditing, cross-board voltage/footprint checks, and conservative IPD pilot/mass-production release gating for hardware engineering teams in Jira and Confluence."
      tools:
        - key: audit-bom-table
          name: "Audit PCBA BOM vs Schematic"
          description: "Compare a BOM CSV against schematic/reference parts to detect swapped values, footprint mismatches (e.g. SMB vs SMA), duplicate designators, missing MPNs, and derating violations."
          function: auditBomResolver
          parameters:
            - name: bomCsv
              type: string
              description: "Raw BOM CSV text (columns: Designator,Value,Footprint,MPN,VoltageRating,BusVoltage,Status)"
              required: true
            - name: schematicJson
              type: string
              description: "Optional JSON array of schematic components [{designator,value,footprint}] for L2 cross-check"
              required: false
        - key: check-ipd-gate
          name: "Evaluate IPD Mass-Production Gate"
          description: "Evaluate open hardware issues and risk-accepted exceptions to return a conservative PASS / CONDITIONAL / REJECT tape-out verdict with owner routing."
          function: checkIpdGateResolver
          parameters:
            - name: boardName
              type: string
              description: "Hardware board or product name (e.g. PB95-Mainboard-RevC)"
              required: true
            - name: issuesJson
              type: string
              description: "JSON array of issues [{id,layer,severity,summary,riskAccepted}]"
              required: true
        - key: trace-hardware-eco
          name: "Trace Hardware ECO Cross-Board Risk"
          description: "Validate connector pinout and power-domain compatibility between two mated PCBs (L4 cross-board check)."
          function: traceEcoResolver
          parameters:
            - name: connectorsJson
              type: string
              description: "JSON array of mated pin pairs [{connector,pin,boardA_net,boardA_voltage,boardB_net,boardB_voltage}]"
              required: true
        - key: generate-review-minutes
          name: "Generate Hardware Review Minutes"
          description: "Produce executive-ready Markdown review minutes with verdict, blockers by owner, and explicit risk-accepted ledger."
          function: generateMinutesResolver
          parameters:
            - name: boardName
              type: string
              description: "Board or product name"
              required: true
            - name: auditJson
              type: string
              description: "JSON output from audit-bom-table or check-ipd-gate"
              required: true

  jira:issuePanel:
    - key: hardwareguard-eco-panel
      title: "HardwareGuard IPD Gate"
      function: ecoPanelResolver
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg

  function:
    - key: auditBomResolver
      handler: index.auditBomResolver
    - key: checkIpdGateResolver
      handler: index.checkIpdGateResolver
    - key: traceEcoResolver
      handler: index.traceEcoResolver
    - key: generateMinutesResolver
      handler: index.generateMinutesResolver
    - key: ecoPanelResolver
      handler: index.ecoPanelResolver

permissions:
  scopes:
    - read:jira-work
    - read:confluence-content.summary
    - read:confluence-content.all

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:forge::app/REPLACE-AFTER-FORGE-REGISTER
